<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A guided process for developing an immersive media portfolio. For Immersive Media Design students."
    />
    <meta name="theme-color" content="#f3efe6" />
    <title>Portfolio Prep</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] !== "/") return;
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(null, "", "/PortfolioPrep" + decoded + l.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Portfolio Prep needs JavaScript to run this guide.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
